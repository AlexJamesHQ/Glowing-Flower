<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>ΛLΞX JΛMΞS ᗪEV - PORTFOLIO & TYPING FX</title>
  
  <!-- Primary Meta Tags -->
  <meta name="title" content="ΛLΞX JΛMΞS ᗪEV">
  <meta name="description" content="ΛLΞX JΛMΞS ᗪEV - UI/UX, Web/App Development & Interactive Design">

  <!-- Open Graph / Social Media -->

  <meta name="apple-mobile-web-app-title" content="ΛLΞX JΛMΞS">

  <!-- Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030305;
      font-family: 'Poppins', 'Anek Bangla', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: radial-gradient(circle, transparent 40%, rgba(2, 2, 5, 0.85) 100%);
      z-index: 5;
    }

    .flower-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 1;
      pointer-events: none; 
      opacity: 0.9;
      filter: contrast(1.1) brightness(0.95);
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    body.keyboard-active .flower-frame {
      transform: translateY(-25%);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      display: block;
      pointer-events: none; 
    }

    #hiddenInput {
      position: absolute;
      opacity: 0;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      cursor: pointer;
    }

    /* Controls Container */
    .controls-container {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      gap: 18px;
      align-items: center;
      transition: bottom 0.3s ease-out;
    }

    body.keyboard-active .controls-container {
      bottom: 320px;
    }

    .control-btn {
      width: 55px;
      height: 55px;
      background: rgba(15, 15, 25, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .control-btn:active {
      transform: scale(0.92);
    }

    .control-btn span {
      font-size: 26px;
      color: rgba(255, 255, 255, 0.85);
    }

    #portfolioBtn {
      border-color: rgba(0, 255, 204, 0.4);
    }

    #portfolioBtn:hover, #portfolioBtn:active {
      background: rgba(0, 30, 35, 0.85);
      border-color: rgba(0, 255, 204, 0.8);
      box-shadow: 0 0 18px rgba(0, 255, 204, 0.4);
    }

    #portfolioBtn span {
      color: #00ffcc;
    }

    #iosVoiceIndicator.active {
      border-color: rgba(0, 255, 204, 0.8);
      background: rgba(0, 25, 35, 0.85);
      animation: iosPulse 1.5s infinite ease-in-out;
    }

    #iosVoiceIndicator.active span {
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc;
    }

    #clearBtn {
      border-color: rgba(255, 80, 100, 0.4);
    }

    #clearBtn:hover, #clearBtn:active {
      background: rgba(40, 10, 20, 0.85);
      border-color: rgba(255, 80, 100, 0.8);
      box-shadow: 0 0 18px rgba(255, 80, 100, 0.4);
    }

    #clearBtn span {
      color: #ff5064;
    }

    @keyframes iosPulse {
      0% { transform: scale(1); box-shadow: 0 0 12px rgba(0, 255, 204, 0.4); }
      50% { transform: scale(1.1); box-shadow: 0 0 20px rgba(0, 255, 204, 0.7); }
      100% { transform: scale(1); box-shadow: 0 0 12px rgba(0, 255, 204, 0.4); }
    }

    /* --- iOS Custom Modal Popup CSS --- */
    .ios-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
    }

    .ios-modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .ios-modal-card {
      width: 85%;
      max-width: 320px;
      background: rgba(30, 30, 45, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 20px;
      padding: 22px 18px 16px 18px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transform: scale(0.85) translateY(20px);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ios-modal-overlay.show .ios-modal-card {
      transform: scale(1) translateY(0);
    }

    .ios-modal-icon {
      width: 48px;
      height: 48px;
      background: rgba(0, 255, 204, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px auto;
    }

    .ios-modal-icon span {
      color: #00ffcc;
      font-size: 26px;
    }

    .ios-modal-title {
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .ios-modal-desc {
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 20px;
      font-weight: 400;
    }

    .ios-modal-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ios-btn {
      width: 100%;
      padding: 12px 0;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s, transform 0.1s;
      text-decoration: none;
      display: block;
    }

    .ios-btn-primary {
      background: #00ffcc;
      color: #030305;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
    }

    .ios-btn-primary:active {
      transform: scale(0.97);
      background: #00e6b8;
    }

    .ios-btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .ios-btn-secondary:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <!-- Background Flower Frame -->
  <iframe class="flower-frame" src="https://dev-tanay.github.io/Animated-Flower/"></iframe>

  <canvas id="particleCanvas"></canvas>
  <input type="text" id="hiddenInput" autocomplete="off" placeholder="Type here...">

  <!-- Control Buttons -->
  <div class="controls-container">
    <div id="iosVoiceIndicator" class="control-btn" title="Voice Input">
      <span class="material-symbols-outlined">mic</span>
    </div>

    <div id="clearBtn" class="control-btn" title="Word By Word Clear">
      <span class="material-symbols-outlined">delete_sweep</span>
    </div>

    <a id="portfolioBtn" class="control-btn" href="https://alex-james.vercel.app" target="_blank" title="Open Portfolio">
      <span class="material-symbols-outlined">person</span>
    </a>
  </div>

  <!-- iOS Animated Glassmorphism Modal -->
  <div id="iosModal" class="ios-modal-overlay">
    <div class="ios-modal-card">
      <div class="ios-modal-icon">
        <span class="material-symbols-outlined">mic_off</span>
      </div>
      <div id="modalTitle" class="ios-modal-title">Browser Restriction</div>
      <div id="modalDesc" class="ios-modal-desc">
        Microphone access is restricted in in-app browsers. Please tap below to open in an external browser.
      </div>
      <div class="ios-modal-actions">
        <button id="openExternalBtn" class="ios-btn ios-btn-primary">Open in Browser</button>
        <button id="closeModalBtn" class="ios-btn ios-btn-secondary">Dismiss</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('copy', (e) => { e.preventDefault(); });
    document.addEventListener('cut', (e) => { e.preventDefault(); });
    document.addEventListener('contextmenu', (e) => { e.preventDefault(); });

    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    const input = document.getElementById('hiddenInput');
    const iosVoiceIndicator = document.getElementById('iosVoiceIndicator');
    const clearBtn = document.getElementById('clearBtn');

    // Modal Elements
    const iosModal = document.getElementById('iosModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const openExternalBtn = document.getElementById('openExternalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    let width, height;
    let startY; 
    let dpr = window.devicePixelRatio || 1;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      ctx.scale(dpr, dpr);
      startY = height * 0.18;
    }
    window.addEventListener('resize', resize);
    resize();

    input.addEventListener('focus', () => { document.body.classList.add('keyboard-active'); });
    input.addEventListener('blur', () => { document.body.classList.remove('keyboard-active'); });

    window.visualViewport?.addEventListener('resize', () => {
      if (window.visualViewport.height < window.innerHeight * 0.75) {
        document.body.classList.add('keyboard-active');
      } else {
        document.body.classList.remove('keyboard-active');
      }
    });

    let userText = "";
    let previousText = "";
    let wordObjects = [];
    let isDeletingSequence = false;
    let cursorPosition = { x: width / 2, y: startY };

    const wordColors = [
      {r: 255, g: 140, b: 200, hex: "#ff8cc8"}, 
      {r: 160, g: 210, b: 255, hex: "#a0d2ff"}, 
      {r: 255, g: 215, b: 130, hex: "#ffd782"}, 
      {r: 200, g: 160, b: 255, hex: "#c8a0ff"}, 
      {r: 130, g: 245, b: 215, hex: "#82f5d7"}  
    ];

    const deleteColors = [
      {r: 255, g: 90,  b: 120},  
      {r: 255, g: 140, b: 160}, 
      {r: 230, g: 100, b: 230}  
    ];

    function drawGlowingHeart(ctx, x, y, size, color, alpha) {
      ctx.save();
      ctx.translate(x, y);
      
      const radGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2.5);
      radGrad.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha * 0.9})`);
      radGrad.addColorStop(0.5, `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha * 0.4})`);
      radGrad.addColorStop(1, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
      
      ctx.fillStyle = radGrad;
      ctx.beginPath();
      ctx.arc(0, 0, size * 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.95})`;
      let s = size / 3;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-3 * s, -3 * s, -6 * s, 1 * s, 0, 6 * s);
      ctx.bezierCurveTo(6 * s, 1 * s, 3 * s, -3 * s, 0, 0);
      ctx.fill();
      
      ctx.restore();
    }

    const fireflies = [];
    const fireflyCount = 28; 

    class Firefly {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 1;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.alpha = Math.random();
        this.pulseSpeed = Math.random() * 0.02 + 0.008;
        this.angle = Math.random() * Math.PI * 2;
        this.color = {r: 200, g: 240, b: 255}; 
      }
      update() {
        this.x += this.vx + Math.sin(this.angle) * 0.2;
        this.y += this.vy + Math.cos(this.angle) * 0.2;
        this.angle += 0.015;
        this.alpha += this.pulseSpeed;
        if (this.alpha > 0.9 || this.alpha < 0.1) this.pulseSpeed = -this.pulseSpeed;
        if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.reset();
      }
      draw() {
        const currentAlpha = Math.max(0, Math.min(1, this.alpha));
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.shadowBlur = 8 * currentAlpha;
        ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.8)`;
        ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${currentAlpha * 0.7})`;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < fireflyCount; i++) fireflies.push(new Firefly());

    const activeParticles = [];

    class DynamicParticle {
      constructor(x, y, color, isHeart = false) {
        this.x = x + (Math.random() - 0.5) * 12;
        this.y = y + (Math.random() - 0.5) * 8;
        
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
        const speed = Math.random() * 2.2 + 0.8; 
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 0.5;
        this.size = isHeart ? (Math.random() * 2.5 + 2.5) : (Math.random() * 2 + 1); 
        this.color = color;
        this.isHeart = isHeart;
        this.life = 1.0;
        this.decay = Math.random() * 0.025 + 0.015; 
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.96;
        this.vy *= 0.96;
        this.life -= this.decay;
      }
      draw() {
        if (this.life <= 0) return;
        if (this.isHeart) {
          drawGlowingHeart(ctx, this.x, this.y, this.size, this.color, this.life);
        } else {
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.life * 0.9})`;
          ctx.shadowBlur = 6 * this.life;
          ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.8)`;
          ctx.fill();
          ctx.restore();
        }
      }
    }

    function spawnCursorTypingBurst(x, y, color) {
      for (let i = 0; i < 4; i++) {
        activeParticles.push(new DynamicParticle(x, y + 15, color, Math.random() > 0.4));
      }
    }

    function syncTextToWordObjects(text) {
      userText = text;
      input.value = text;

      let words = text.trim() ? text.trim().split(/\s+/) : [];
      
      wordObjects = words.map((w, idx) => ({
        text: w,
        opacity: 1.0,
        offsetY: 0,
        isDissolving: false,
        color: wordColors[idx % wordColors.length]
      }));
    }

    input.addEventListener('input', (e) => {
      isDeletingSequence = false;
      const newText = input.value;

      if (newText.length > previousText.length) {
        const curColor = wordColors[newText.length % wordColors.length];
        spawnCursorTypingBurst(cursorPosition.x, cursorPosition.y, curColor);
      } else if (newText.length < previousText.length) {
        const randDeleteColor = deleteColors[Math.floor(Math.random() * deleteColors.length)];
        spawnCursorTypingBurst(cursorPosition.x, cursorPosition.y, randDeleteColor);
      }

      syncTextToWordObjects(newText);
      previousText = newText;
    });

    function startWordDissolveDelete() {
      if (isDeletingSequence || wordObjects.length === 0) return;
      isDeletingSequence = true;

      let index = 0;

      function dissolveNextWord() {
        if (index < wordObjects.length) {
          let targetObj = wordObjects[index];
          targetObj.isDissolving = true;
          targetObj.color = deleteColors[Math.floor(Math.random() * deleteColors.length)];

          index++;
          setTimeout(dissolveNextWord, 260); 
        } else {
          setTimeout(() => {
            syncTextToWordObjects("");
            previousText = "";
            isDeletingSequence = false;
          }, 320);
        }
      }

      dissolveNextWord();
    }

    clearBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startWordDissolveDelete();
    });

    /* --- Universal External Browser Redirect Logic --- */
    function openInNativeBrowser() {
      const currentUrl = window.location.href;
      const ua = navigator.userAgent || navigator.vendor || window.opera;

      // Android Intent Trigger for Chrome
      if (/android/i.test(ua)) {
        const cleanUrl = currentUrl.replace(/^https?:\/\//, '');
        const intentUrl = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end;`;
        window.location.href = intentUrl;
      } 
      // iOS / iPad OS Browser Bypass Strategy
      else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
        window.location.href = currentUrl;
      } 
      // Fallback for others
      else {
        window.open(currentUrl, '_blank');
      }
    }

    /* --- iOS Custom Modal Helper Functions --- */
    function showiOSModal(title, message) {
      modalTitle.textContent = title;
      modalDesc.textContent = message;
      iosModal.classList.add('show');
    }

    openExternalBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openInNativeBrowser();
    });

    closeModalBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      iosModal.classList.remove('show');
    });

    iosModal.addEventListener('click', (e) => {
      if (e.target === iosModal) {
        iosModal.classList.remove('show');
      }
    });

    /* --- Voice Recognition Logic --- */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'bn-BD';

      recognition.onstart = () => {
        isListening = true;
        iosVoiceIndicator.classList.add('active');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        const currentVal = input.value;
        const updatedVal = currentVal ? `${currentVal} ${transcript}` : transcript;
        
        syncTextToWordObjects(updatedVal);
        previousText = updatedVal;
      };

      recognition.onerror = (e) => {
        console.error("Speech Error:", e.error);
        stopListening();
      };

      recognition.onend = () => {
        stopListening();
      };
    }

    function stopListening() {
      isListening = false;
      iosVoiceIndicator.classList.remove('active');
      if (recognition) recognition.stop();
    }

    iosVoiceIndicator.addEventListener('click', (e) => {
      e.stopPropagation();

      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isInApp = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);

      if (isInApp) {
        showiOSModal(
          "Browser Restriction",
          "Microphone access is restricted in in-app browsers. Please tap below to open in an external browser."
        );
        return;
      }

      if (!recognition) {
        showiOSModal(
          "Speech Not Supported",
          "Voice input is not supported in this browser. Please try using Google Chrome or Safari."
        );
        return;
      }

      if (isListening) {
        stopListening();
      } else {
        try {
          recognition.start();
        } catch (err) {
          stopListening();
        }
      }
    });

    window.addEventListener('click', (e) => {
      if (e.target.closest('.controls-container') || e.target.closest('.ios-modal-card')) return;
      input.focus();
    });

    const primaryFont = '"Poppins", "Anek Bangla", sans-serif';

    function getWrappedLines(wordsArr, maxWidth, fontSize) {
      ctx.font = `800 ${fontSize}px ${primaryFont}`;
      let lines = [];
      let currentLine = [];
      let currentLineWidth = 0;

      for (let i = 0; i < wordsArr.length; i++) {
        let wObj = wordsArr[i];
        let wordWidth = ctx.measureText(wObj.text).width;
        let spaceWidth = ctx.measureText(" ").width;

        if (currentLineWidth + wordWidth <= maxWidth) {
          currentLine.push(wObj);
          currentLineWidth += wordWidth + spaceWidth;
        } else {
          if (currentLine.length > 0) lines.push(currentLine);
          currentLine = [wObj];
          currentLineWidth = wordWidth + spaceWidth;
        }
      }
      if (currentLine.length > 0) lines.push(currentLine);
      return lines;
    }

    let blinkTimer = 0;
    let showCursor = true;
    let lastTime = 0;

    function renderLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = timestamp - lastTime;
      lastTime = timestamp;

      blinkTimer += delta;
      if (blinkTimer > 400) {
        showCursor = !showCursor;
        blinkTimer = 0;
      }

      ctx.clearRect(0, 0, width, height);

      fireflies.forEach(f => { f.update(); f.draw(); });

      for (let i = activeParticles.length - 1; i >= 0; i--) {
        const p = activeParticles[i];
        p.update(); p.draw();
        if (p.life <= 0) activeParticles.splice(i, 1);
      }

      const maxWidth = width * 0.85;
      const baseFontSize = Math.min(Math.max(width * 0.075, 24), 36);
      const lineHeight = baseFontSize * 1.55;

      const lines = getWrappedLines(wordObjects, maxWidth, baseFontSize);

      ctx.save();
      ctx.textBaseline = 'top';

      lines.forEach((line, lineIndex) => {
        let lineY = startY + (lineIndex * lineHeight);

        ctx.font = `800 ${baseFontSize}px ${primaryFont}`;
        let totalLineWidth = 0;
        line.forEach(w => {
          totalLineWidth += ctx.measureText(w.text + " ").width;
        });

        let currentX = (width - totalLineWidth) / 2;

        line.forEach((wObj) => {
          let wordWidth = ctx.measureText(wObj.text).width;

          if (wObj.isDissolving) {
            wObj.opacity -= 0.03; 
            wObj.offsetY -= 0.8;   

            if (wObj.opacity > 0.15 && Math.random() > 0.3) {
              activeParticles.push(new DynamicParticle(
                currentX + Math.random() * wordWidth, 
                lineY + wObj.offsetY + Math.random() * baseFontSize, 
                wObj.color, 
                Math.random() > 0.5
              ));
            }
          }

          let alpha = Math.max(0, wObj.opacity);

          if (alpha > 0) {
            ctx.save();
            ctx.translate(currentX, lineY + wObj.offsetY);

            ctx.strokeStyle = `rgba(0, 0, 0, ${alpha * 0.9})`;
            ctx.lineWidth = 5;
            ctx.lineJoin = 'round';
            ctx.strokeText(wObj.text, 0, 0);

            ctx.shadowBlur = 12;
            ctx.shadowColor = `rgba(${wObj.color.r}, ${wObj.color.g}, ${wObj.color.b}, ${alpha * 0.75})`;
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.98})`;
            ctx.fillText(wObj.text, 0, 0);

            ctx.restore();
          }

          currentX += ctx.measureText(wObj.text + " ").width;
        });

        if (lineIndex === lines.length - 1) {
          cursorPosition = { x: currentX, y: lineY };

          if (showCursor && !isDeletingSequence) {
            ctx.save();
            ctx.font = `800 ${baseFontSize}px ${primaryFont}`;
            ctx.fillStyle = `rgba(255, 255, 255, 0.9)`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
            ctx.fillText("|", currentX - 3, lineY);
            ctx.restore();
          }
        }
      });

      ctx.restore();

      requestAnimationFrame(renderLoop);
    }

    document.fonts.ready.then(() => {
      requestAnimationFrame(renderLoop);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
