  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: 'Anek Bangla', 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .flower-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 1;
      pointer-events: none; 
      opacity: 0.85;
      transition: transform 0.3s ease-out;
    }

    body.keyboard-active .flower-frame {
      transform: translateY(-28%);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      display: block;
      pointer-events: none; 
    }

    #hiddenInput {
      position: absolute;
      opacity: 0;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      cursor: pointer;
    }

    #hiddenFlowerLink {
      position: absolute;
      top: 50%;            
      left: 50%;           
      transform: translate(-50%, -50%);
      width: 180px;        
      height: 180px;
      border-radius: 50%; 
      z-index: 30;         
      cursor: pointer;
      background: transparent;
      display: block;
      transition: top 0.3s ease-out;
    }

    body.keyboard-active #hiddenFlowerLink {
      top: 22%; 
    }

    /* iOS স্টাইল ভয়েস ইন্ডিকেটর (ক্লিকযোগ্য অন/অফ বাটন) */
    #iosVoiceIndicator {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      width: 55px;
      height: 55px;
      background: rgba(20, 20, 30, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s ease;
    }

    #iosVoiceIndicator span {
      font-size: 26px;
      color: #888;
      transition: color 0.3s, text-shadow 0.3s;
    }

    #iosVoiceIndicator.active {
      border-color: rgba(0, 255, 204, 0.6);
      background: rgba(0, 20, 30, 0.85);
      animation: iosPulse 1.5s infinite ease-in-out;
    }

    #iosVoiceIndicator.active span {
      color: #00ffcc;
      text-shadow: 0 0 12px #00ffcc, 0 0 20px #00ffcc;
    }

    @keyframes iosPulse {
      0% {
        transform: translateX(-50%) scale(1);
        box-shadow: 0 0 10px rgba(0, 255, 204, 0.3), inset 0 0 5px rgba(0, 255, 204, 0.2);
      }
      50% {
        transform: translateX(-50%) scale(1.15);
        box-shadow: 0 0 25px rgba(0, 255, 204, 0.8), inset 0 0 12px rgba(0, 255, 204, 0.5);
      }
      100% {
        transform: translateX(-50%) scale(1);
        box-shadow: 0 0 10px rgba(0, 255, 204, 0.3), inset 0 0 5px rgba(0, 255, 204, 0.2);
      }
    }

<body>

  <iframe class="flower-frame" src="https://dev-tanay.github.io/Animated-Flower/"></iframe>

  <a id="hiddenFlowerLink" href="https://alex-james.vercel.app" target="_blank" title="Portfolio"></a>

  <canvas id="particleCanvas"></canvas>
  <input type="text" id="hiddenInput" autocomplete="off" placeholder="Type here...">

  <div id="iosVoiceIndicator">
    <span class="material-symbols-outlined">mic</span>
  </div>

  <script>
    document.addEventListener('copy', (e) => {
      e.preventDefault();
      alert('এই পেজ থেকে লেখা কপি করা নিষেধ!');
    });

    document.addEventListener('cut', (e) => {
      e.preventDefault();
    });

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    const input = document.getElementById('hiddenInput');
    const iosVoiceIndicator = document.getElementById('iosVoiceIndicator');

    let width, height;
    let startY; 
    let dpr = window.devicePixelRatio || 1;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      ctx.scale(dpr, dpr);
      startY = height * 0.12; 
    }
    window.addEventListener('resize', resize);
    resize();

    input.addEventListener('focus', () => {
      document.body.classList.add('keyboard-active');
    });

    input.addEventListener('blur', () => {
      document.body.classList.remove('keyboard-active');
    });

    window.visualViewport?.addEventListener('resize', () => {
      if (window.visualViewport.height < window.innerHeight * 0.75) {
        document.body.classList.add('keyboard-active');
      } else {
        document.body.classList.remove('keyboard-active');
      }
    });

    let userText = "";
    let previousLength = 0;
    let textScale = 1;
    let targetScale = 1;

    let pasteQueue = [];
    let pasteInterval = null;
    let lineAnimations = [];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(type = 'start') {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      oscillator.type = 'sine';
      if (type === 'start') {
        oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
      } else {
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.1);
      }

      gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.12);
    }

    const canvaColors = [
      {r: 255, g: 75,  b: 130}, 
      {r: 255, g: 130, b: 180}, 
      {r: 255, g: 200, b: 80},  
      {r: 160, g: 110, b: 255}, 
      {r: 0,   g: 210, b: 255}  
    ];

    const deleteColors = [
      {r: 255, g: 80,  b: 80},  
      {r: 180, g: 180, b: 200}, 
      {r: 255, g: 120, b: 120}  
    ];

    let currentColor = canvaColors[0];

    function drawHeart(ctx, x, y, size, color, alpha, glow = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
      
      if (glow) {
        ctx.shadowBlur = 6;
        ctx.shadowColor = `rgb(${color.r}, ${color.g}, ${color.b})`;
      }

      let s = size / 3;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-3 * s, -3 * s, -6 * s, 1 * s, 0, 6 * s);
      ctx.bezierCurveTo(6 * s, 1 * s, 3 * s, -3 * s, 0, 0);
      ctx.fill();
      ctx.restore();
    }

    const fireflies = [];
    const fireflyCount = 45;

    class Firefly {
      constructor() { this.reset(); }
      
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 1.2;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        
        this.alpha = Math.random();
        this.pulseSpeed = Math.random() * 0.03 + 0.01;
        this.angle = Math.random() * Math.PI * 2;
        
        this.color = {r: 212, g: 255, b: 80}; 
      }

      update() {
        this.x += this.vx + Math.sin(this.angle) * 0.2;
        this.y += this.vy + Math.cos(this.angle) * 0.2;
        this.angle += 0.02;

        this.alpha += this.pulseSpeed;
        if (this.alpha > 1 || this.alpha < 0.05) {
          this.pulseSpeed = -this.pulseSpeed;
        }

        if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
          this.reset();
        }
      }

      draw() {
        const currentAlpha = Math.max(0, Math.min(1, this.alpha));
        
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        
        ctx.shadowBlur = 12 * currentAlpha;
        ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 1)`;
        ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${currentAlpha})`;
        
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < fireflyCount; i++) {
      fireflies.push(new Firefly());
    }

    const activeParticles = [];

    class CanvaParticle {
      constructor(x, y, color, isDelete = false) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * (isDelete ? 4 : 2.5) + 0.8;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - (isDelete ? 0.5 : 1);
        this.size = Math.random() * 3 + 2;
        this.color = color;
        this.life = 1.0;
        this.decay = Math.random() * 0.025 + 0.015;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.95;
        this.vy *= 0.95;
        this.life -= this.decay;
      }
      draw() {
        if (this.life <= 0) return;
        drawHeart(ctx, this.x, this.y, this.size, this.color, this.life, true);
      }
    }

    function triggerCanvaEffect(isDelete = false, currentY = startY, isSoft = false) {
      const particleCount = isSoft ? 3 : (isDelete ? 12 : 8);
      for (let i = 0; i < particleCount; i++) {
        const offsetX = (Math.random() - 0.5) * (width * 0.4);
        const offsetY = (Math.random() - 0.5) * 15;
        activeParticles.push(new CanvaParticle(width / 2 + offsetX, currentY + offsetY, currentColor, isDelete));
      }
    }

    function updateTextContent(newText, isSoftAnim = false) {
      if (newText.length < previousLength) {
        currentColor = deleteColors[Math.floor(Math.random() * deleteColors.length)];
        textScale = 0.98;
        triggerCanvaEffect(true, startY + (lineAnimations.length * 30));
      } else if (newText.length > previousLength) {
        currentColor = canvaColors[newText.length % canvaColors.length];
        textScale = isSoftAnim ? 1.01 : 1.03;
        triggerCanvaEffect(false, startY + (lineAnimations.length * 30), isSoftAnim);
      }

      userText = newText;
      input.value = newText;
      previousLength = newText.length;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isUserManuallyStopped = false; // ব্যবহারকারী নিজে বন্ধ করেছেন কিনা তা ট্র্যাক করবে

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'bn-BD';

      recognition.onstart = () => {
        iosVoiceIndicator.classList.add('active');
        playBeep('start');
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        updateTextContent(transcript);
      };

      recognition.onend = () => {
        iosVoiceIndicator.classList.remove('active');
        playBeep('end');
        
        // যদি ব্যবহারকারী নিজে বন্ধ না করে থাকেন, তবেই অটো রিস্টার্ট হবে
        if (!isUserManuallyStopped) {
          setTimeout(() => {
            try { recognition.start(); } catch (e) {}
          }, 1000);
        }
      };

      recognition.onerror = (e) => {
        if (!isUserManuallyStopped) {
          setTimeout(() => {
            try { recognition.start(); } catch (e) {}
          }, 1200);
        }
      };
    }

    // মাইক্রোফোন আইকনে ক্লিক করলে অন/অফ টগল হবে
    iosVoiceIndicator.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!recognition) return;

      if (isUserManuallyStopped) {
        // অন করার জন্য
        isUserManuallyStopped = false;
        try { recognition.start(); } catch (e) {}
      } else {
        // বন্ধ করার জন্য
        isUserManuallyStopped = true;
        try { recognition.stop(); } catch (e) {}
      }
    });

    // স্ক্রিনের অন্য কোথাও ক্লিক করলে ইনপুট ফোকাস হবে
    window.addEventListener('click', (e) => {
      if (e.target.id === 'hiddenFlowerLink' || e.target.closest('#iosVoiceIndicator')) return;
      input.focus();
    });

    const primaryFont = '"Anek Bangla", "Poppins", sans-serif';

    function getWrappedLines(text, maxWidth, fontSize) {
      ctx.font = `700 ${fontSize}px ${primaryFont}`;

      let words = text.split(' ');
      let lines = [];
      let currentLine = "";

      for (let i = 0; i < words.length; i++) {
        let word = words[i];
        let testLine = currentLine ? currentLine + " " + word : word;

        if (ctx.measureText(testLine).width <= maxWidth) {
          currentLine = testLine;
        } else {
          if (currentLine) {
            lines.push(currentLine);
            currentLine = "";
          }

          if (ctx.measureText(word).width > maxWidth) {
            let chars = Array.from(word);
            let subLine = "";
            for (let c of chars) {
              if (ctx.measureText(subLine + c).width > maxWidth) {
                lines.push(subLine);
                subLine = c;
              } else {
                subLine += c;
              }
            }
            currentLine = subLine;
          } else {
            currentLine = word;
          }
        }
      }
      if (currentLine) lines.push(currentLine);

      return lines;
    }

    let blinkTimer = 0;
    let showCursor = true;
    let lastTime = 0;

    function renderLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = timestamp - lastTime;
      lastTime = timestamp;

      blinkTimer += delta;
      if (blinkTimer > 450) {
        showCursor = !showCursor;
        blinkTimer = 0;
      }

      textScale += (targetScale - textScale) * 0.1;

      ctx.clearRect(0, 0, width, height);

      fireflies.forEach(f => {
        f.update();
        f.draw();
      });

      for (let i = activeParticles.length - 1; i >= 0; i--) {
        const p = activeParticles[i];
        p.update();
        p.draw();
        if (p.life <= 0) {
          activeParticles.splice(i, 1);
        }
      }

      const maxWidth = width * 0.85;
      const baseFontSize = Math.min(Math.max(width * 0.065, 20), 32);

      const lines = getWrappedLines(userText, maxWidth, baseFontSize);

      while (lineAnimations.length < lines.length) {
        lineAnimations.push({
          offsetY: 8, 
          opacity: 0   
        });
      }
      if (lineAnimations.length > lines.length) {
        lineAnimations = lineAnimations.slice(0, lines.length);
      }

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      const lineHeight = baseFontSize * 1.45;

      lines.forEach((line, index) => {
        let anim = lineAnimations[index];
        if (anim) {
          anim.offsetY += (0 - anim.offsetY) * 0.1;
          anim.opacity += (1 - anim.opacity) * 0.1;
        }

        let lineText = line;
        if (index === lines.length - 1) {
          lineText += (showCursor ? '|' : ' ');
        }

        let lineY = startY + (index * lineHeight) + (anim ? anim.offsetY : 0);

        ctx.save();
        ctx.translate(width / 2, lineY);
        ctx.scale(textScale, textScale);

        ctx.font = `700 ${baseFontSize}px ${primaryFont}`;
        
        ctx.strokeStyle = `rgba(5, 5, 8, ${0.9 * (anim ? anim.opacity : 1)})`;
        ctx.lineWidth = 5;
        ctx.lineJoin = 'round';
        ctx.strokeText(lineText, 0, 0);

        ctx.shadowBlur = 10;
        ctx.shadowColor = `rgba(${currentColor.r}, ${currentColor.g}, ${currentColor.b}, ${0.8 * (anim ? anim.opacity : 1)})`;
        ctx.fillStyle = `rgba(255, 255, 255, ${anim ? anim.opacity : 1})`;

        ctx.fillText(lineText, 0, 0);
        ctx.restore();
      });

      ctx.restore();

      requestAnimationFrame(renderLoop);
    }

    document.fonts.ready.then(() => {
      requestAnimationFrame(renderLoop);
      // পেজ লোড হওয়ার সাথে সাথে মাইক্রোফোন চালু হবে
      setTimeout(() => {
        try { recognition.start(); } catch(e) {}
      }, 500);
    });
  </script>
</body>
